name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.15"
      - run: uv sync --locked --extra dev --python 3.11
      - run: uv run --locked ruff check .
      - run: uv run --locked pytest
