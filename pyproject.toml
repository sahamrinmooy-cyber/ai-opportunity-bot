[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-opportunity-bot"
version = "0.1.0"
description = "A local-first desktop AI assistant with user-approved browser and workspace actions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "keyring>=25,<27",
  "playwright>=1.50,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
opportunity-bot = "opportunity_bot.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
